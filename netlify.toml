[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The MediaPipe wasm and the gesture model are ~42 MB and content-stable, so they
# are worth pinning hard in the cache — otherwise every visit re-downloads them
# before the camera can do anything.
[[headers]]
  for = "/mp/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
